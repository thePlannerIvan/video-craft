    function sanitizeSvgForInline(rawSvg) {
      if (!rawSvg) return rawSvg;
      return rawSvg.replace(/:root\b/g, "svg");
    }

    /* ---- 加载并渲染当前选中屏的真实 SVG 与动效编排轨 ---- */
    async function loadScreenSvg(st, seekVideo = true) {
      const pageKey = st.sourcePageKey || st.id;
      state.sourcePageKey = pageKey;
      // 「当前屏」就是选中的这一屏，无条件记下。原先只在「扬声器视频可见且没有 SVG」
      // 这条分支里赋值，而很多项目根本没有扬声器轨 —— 于是 currentScreenObj 永远是
      // null，「上一屏 / 下一屏」和全局播放全都没反应。
      state.currentScreenObj = st;
      let svgText = null;

      // 1. 优先从页面内联字典读（原型展示或离线打包时注入）
      if (window.__INLINE_SVGS__ && window.__INLINE_SVGS__[pageKey]) {
        svgText = window.__INLINE_SVGS__[pageKey];
      }
      // 2. 尝试通过连接读取 input/scenes/<key>.svg 或 pages/<key>.svg
      const hasSvg = !!(st.sourcePageKey
        || (window.__INLINE_SVGS__ && window.__INLINE_SVGS__[pageKey])
        || (window.__REVIEW_DATA__?.svgAssets && window.__REVIEW_DATA__.svgAssets[pageKey]));
      if (!svgText && hasSvg && review && typeof review.readText === "function") {
        for (const cand of [`input/scenes/${pageKey}.svg`, `composition/pages/${pageKey}.svg`]) {
          try {
            const t = await review.readText(cand, { optional: true });
            if (t && t.includes("<svg")) { svgText = t; break; }
          } catch {}
        }
      }

      const host = document.getElementById("svg-stage-host");
      if (!svgText) {
        host.textContent = "当前屏暂无静态画面";
        if (!document.getElementById("stage-speaker-video").hidden) {
          state.currentScreenObj = st;
          if (seekVideo) document.getElementById("stage-speaker-video").currentTime = (st.startMs || 0) / 1000;
        }
        return;
      }

      if (stageViewMode !== "live") setStageViewMode("svg");
      host.innerHTML = sanitizeSvgForInline(svgText);
      const svgEl = host.querySelector("svg");
      if (!svgEl) return;
      for (const image of svgEl.querySelectorAll("image")) {
        const href = image.getAttribute("href") || image.getAttributeNS("http://www.w3.org/1999/xlink", "href");
        if (!href || /^(data:|blob:|#)/.test(href)) continue;
        try {
          const rel = window.__REVIEW_DATA__?.svgAssets?.[pageKey]?.[href];
          if (!rel) throw new Error(`图片未登记：${href}`);
          const url = await assetUrl(rel);
          image.setAttribute("href", url);
          image.setAttributeNS("http://www.w3.org/1999/xlink", "href", url);
        } catch (error) { label(error.message, "error"); }
      }

      state.currentScreenObj = st;
      // 应用已保存的本屏编排覆盖
      const screenChoreo = state.choreoOverrides[st.id] || { focusMode: state.focusMode, steps: {} };
      window.VideoCraftAnimEngine.setChoreography(svgEl, screenChoreo);
      window.VideoCraftAnimEngine.setStep(svgEl, 1, true, { focusMode: state.focusMode });
      state.activeSvgStep = 1;

      // 如果配置了真实口播视频，定位到本屏起点
      const spkVid = document.getElementById("stage-speaker-video");
      const spkPill = document.getElementById("speaker-time-pill");
      const curT = (st.startMs || 0) / 1000;
      if (spkVid && !spkVid.hidden && spkVid.src && seekVideo) {
        try {
          spkVid.pause();
          spkVid.currentTime = curT;
          if (spkPill) spkPill.textContent = `🔊 ${curT.toFixed(1)}s · ${st.id}`;
        } catch {}
      }
      updateStageSubtitle(st, curT);
      if (stageViewMode !== "live" || seekVideo) updateScrubberDisplay(st.startMs || 0);
    }

    let speakerSyncRaf = null;
    function clearPlaySequence() {
      playSequenceTimers.forEach(t => clearTimeout(t));
      playSequenceTimers = [];
      if (speakerSyncRaf) {
        cancelAnimationFrame(speakerSyncRaf);
        speakerSyncRaf = null;
      }
      const spkVid = document.getElementById("stage-speaker-video");
      if (spkVid && !spkVid.paused) {
        try { spkVid.pause(); } catch {}
      }
    }

    function playWithSpeakerOrTimers(st, svgEl, startStepNum = null, isGlobal = false) {
      if (stageViewMode === "live" && st) {
        const cue = startStepNum === null ? null : st.cues?.[Math.max(0, startStepNum - 1)];
        const start = (st.startMs || 0) / 1000 + (cue?.relStartSec || 0);
        if (isGlobal) { liveStage.seek(start); liveStage.play(); }
        else liveStage.range(start, ((st.startMs || 0) + st.durationMs) / 1000);
        return;
      }
      if (!st || !svgEl) return;
      clearPlaySequence();
      const items = window.VideoCraftAnimEngine.inspect(svgEl);
      if (!items.length) return;
      const spkVid = document.getElementById("stage-speaker-video");
      const spkPill = document.getElementById("speaker-time-pill");
      const screenStartSec = (st.startMs || 0) / 1000;
      const screenDurSec = Math.max(1.5, (st.durationMs || 5000) / 1000);
      const screenEndSec = screenStartSec + screenDurSec;

      const schedule = items.map((it, idx) => {
        const rel = it.relStartSec !== undefined
          ? Number(it.relStartSec)
          : Number(((idx / Math.max(1, items.length)) * screenDurSec * 0.78).toFixed(2));
        return { step: it.step, relStartSec: rel, cue: it.cue || it.id };
      }).sort((a, b) => a.relStartSec - b.relStartSec);

      const initialEntry = startStepNum !== null
        ? (schedule.find(s => s.step === startStepNum) || schedule[0])
        : schedule[0];

      state.activeSvgStep = initialEntry.step;
      window.VideoCraftAnimEngine.setStep(svgEl, initialEntry.step, true, { focusMode: state.focusMode });

      if (spkVid && !spkVid.hidden && spkVid.src) {
        const seekSec = screenStartSec + Math.max(0, initialEntry.relStartSec);
        try {
          spkVid.playbackRate = 1 / (window.VideoCraftAnimEngine.getSpeedMultiplier() || 1);
          if (Math.abs(spkVid.currentTime - seekSec) > 0.5) {
            spkVid.currentTime = seekSec;
          }
          const p = spkVid.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        } catch {}

        function tickSpeaker() {
          if (!spkVid || spkVid.paused) return;
          const curT = spkVid.currentTime;
          const relT = Math.max(0, curT - screenStartSec);
          if (spkPill) {
            spkPill.textContent = `🔊 ${curT.toFixed(1)}s (本屏 +${relT.toFixed(1)}s)`;
          }
          updateStageSubtitle(st, curT);
          updateScrubberDisplay(curT * 1000);

          let targetStep = initialEntry.step;
          for (const s of schedule) {
            if (relT + 0.04 >= s.relStartSec) targetStep = s.step;
          }
          if (targetStep !== state.activeSvgStep) {
            state.activeSvgStep = targetStep;
            window.VideoCraftAnimEngine.setStep(svgEl, targetStep, true, { focusMode: state.focusMode });
          }
          if (curT >= screenEndSec) {
            if (isGlobal || isGlobalPlaying) {
              // 自动切换到下一屏，实现全片连续无缝播放
              const curIdx = allScreensList.findIndex(s => s.id === st.id);
              if (curIdx >= 0 && curIdx < allScreensList.length - 1) {
                const nextScreen = allScreensList[curIdx + 1];
                switchToScreen(nextScreen, false).then(() => {
                  const nextSvgEl = document.querySelector("#svg-stage-host > svg");
                  if (nextSvgEl) playWithSpeakerOrTimers(nextScreen, nextSvgEl, null, true);
                });
                return;
              }
            }
            try { spkVid.pause(); } catch {}
            pauseGlobalPlayback();
            speakerSyncRaf = null;
            return;
          }
          speakerSyncRaf = requestAnimationFrame(tickSpeaker);
        }
        speakerSyncRaf = requestAnimationFrame(tickSpeaker);
        return;
      }

      // 无口播视频时的纯定时器回退（按 relStartSec 精确连播）
      if (startStepNum !== null) return;
      const baseRel = schedule[0].relStartSec;
      schedule.forEach((s, i) => {
        const delayMs = schedule.some(x => x.relStartSec > 0)
          ? Math.max(0, (s.relStartSec - baseRel) * 1000)
          : i * 1150;
        const tid = setTimeout(() => {
          state.activeSvgStep = s.step;
          window.VideoCraftAnimEngine.setStep(svgEl, s.step, true, { focusMode: state.focusMode });
        }, delayMs * window.VideoCraftAnimEngine.getSpeedMultiplier());
        playSequenceTimers.push(tid);
      });
    }

    let playbackRate = 1;
    document.getElementById("btn-speed-toggle").addEventListener("click", (e) => {
      const rates = [1, 1.5, 2, 4, 0.5];
      playbackRate = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
      liveStage.rate(playbackRate);
      document.querySelectorAll("video").forEach(v => { v.playbackRate = playbackRate; });
      window.VideoCraftAnimEngine.setSpeedMultiplier(1 / playbackRate);
      e.currentTarget.textContent = playbackRate + "×";
      e.currentTarget.setAttribute("aria-label", "播放速度 " + playbackRate + " 倍");
    });

    /* 调整项的归属键 —— **单一出处**。
       2026-10-16 修的缺陷：写入侧用过两个不同的兜底键，而读取侧一律用裸 `state.step`。
       现在写入与读取都走这一个函数，键域不可能再分叉。 */
    const UNSCOPED = "global";
    const adjustKey = () => state.step || UNSCOPED;

    /* 提交时要带上的调整项。 */
    function collectAdjustments() {
      const sid = adjustKey();
      const un = sid === UNSCOPED ? null : UNSCOPED;
      const merge = (a, b) => (a || []).concat(b || []);
      return {
        choreography: state.choreoOverrides[sid] || (un ? state.choreoOverrides[un] : null) || null,
        svg_edits: merge(state.svgEdits[sid], un ? state.svgEdits[un] : null),
        annotations: merge(state.annotations[sid], un ? state.annotations[un] : null),
      };
    }

    /* ---- 加载时间轴并渲染左侧分屏清单（严格保持 .step 与 .step-caption 契约） ---- */
    async function loadTimeline() {
      let data;
      try {
        data = JSON.parse(await review.readText(TIMELINE_REL));
      } catch (error) {
        if (window.__INLINE_TIMELINE__) {
          data = window.__INLINE_TIMELINE__;
          if (window.__REVIEW_DATA__?.timelinePath) {
            staleNoted = true;
            noteStaleFree("无法确认是否为最新内容，当前显示已保存版本。", { withReload: true });
          }
        } else {
          document.getElementById("project-name").textContent = "加载失败";
          label("加载失败", "error");
          return null;
        }
      }
      data = normalizeTimeline(data);
      timelineFingerprint = fingerprint(data);
      loadedTimelineId = shortId(timelineFingerprint);
      document.getElementById("project-name").textContent = data.totalChapters + " 章 · " + data.totalSteps + " 步 · " + fmt(data.totalDurationMs);
      document.getElementById("step-counter-badge").textContent = `${data.totalSteps} 屏`;

      // 尝试加载增强审阅契约 review/review_data.json 并同步生产模式
      if (review && typeof review.readText === "function" && !window.__REVIEW_DATA__) {
        try {
          const revText = await review.readText("review/review_data.json", { optional: true });
          if (revText) window.__REVIEW_DATA__ = JSON.parse(revText);
        } catch {}
      }
      if (window.__REVIEW_DATA__) {
        const rev = window.__REVIEW_DATA__;
        loadedReviewSnapshot = rev.snapshot || null;
        if (rev.mode) {
          document.body.classList.add(`mode-${rev.mode}`);
        }
        if (rev.svgs) {
          window.__INLINE_SVGS__ = Object.assign(window.__INLINE_SVGS__ || {}, rev.svgs);
        }
      }

      // 如果配置了真实口播视频，挂载到左侧口播区
      // The host hands whole files to this page, so an oversized channel is a hang
      // rather than a slow load. Measured: a real project named a 1.19 GB
      // talking-head master as `speakerVideo`, and this block attached it on init
      // regardless of which stage the reviewer wanted — three copies of 1.19 GB
      // (host read, structured clone, Blob) before any picture appeared.
      const sizesOf = (rel) => (rel && window.__REVIEW_DATA__?.media?.sizes?.[rel]) || null;
      const spkVid = document.getElementById("stage-speaker-video");
      const spkPill = document.getElementById("speaker-time-pill");
      const spkUrl = data.speakerVideoUrl || window.__SPEAKER_VIDEO_URL__ || window.__REVIEW_DATA__?.media?.guideAudio;
      const spkSize = spkUrl ? sizesOf(spkUrl) : null;
      if (spkVid && spkUrl && spkSize && spkSize.oversized) {
        spkVid.hidden = true;
        if (spkPill) spkPill.hidden = true;
        label("人声视频文件较大，请先生成轻量预览版或在本地播放器查看。");
      } else if (spkVid && spkUrl) {
        const ready = await attachMedia(spkVid, spkUrl);
        spkVid.hidden = !ready;
        if (spkPill) spkPill.hidden = !ready;
      }
      const compVid = document.getElementById("composite-video-player");
      const compUrl = data.compositeVideoUrl || window.__COMPOSITE_VIDEO_URL__ ||
        window.__REVIEW_DATA__?.media?.previewVideo || window.__SPEAKER_VIDEO_URL__;
      const compSize = compUrl ? sizesOf(compUrl) : null;
      if (compVid && compUrl && (!compSize || !compSize.oversized)) {
        await attachMedia(compVid, compUrl);
      }

      // ---- 覆盖层预览：把 EDL 的视觉层叠在成片上 ----
      // 烘焙进成片的层只能作为"已渲染结果"被审。这里让页面自己对同一份源合成，
      // 于是改一层不必重渲整片。浏览器读不出 MOV/ProRes 的 alpha，只认带 alpha 的
      // WebM —— build_review 为每个层挑好 previewFile，没有载体就明说，不假装。
      const layerStack = document.getElementById("layer-stack");
      const layerDefs = (window.__REVIEW_DATA__?.media?.layers) || [];
      const layerEls = [];
      const layersBaked = window.__REVIEW_DATA__?.media?.layersBaked !== false;
      async function initLayers() {
        if (!layerStack || !compVid || !layerDefs.length) return;
        if (layersBaked) {
          // 成片里已经烘焙了这些层。再叠一遍就是重影，所以宁可不叠并说清楚。
          noteStaleFree("当前成片已包含完整画面层，无需重复叠加。");
          return;
        }
        let skipped = 0;
        for (const def of layerDefs) {
          if (!def.previewFile) { skipped += 1; continue; }
          const el = document.createElement("video");
          el.className = "vc-layer";
          el.muted = true; el.playsInline = true; el.preload = "auto";
          el.dataset.unitId = def.unitId || "";
          try {
            el.src = (review && typeof review.asset === "function")
              ? await review.asset(def.previewFile) : def.previewFile;
          } catch { skipped += 1; continue; }
          layerStack.appendChild(el);
          layerEls.push({ def, el });
        }
        layerStack.hidden = layerEls.length === 0;
        if (skipped) {
          noteStaleFree(`${skipped} 个透明图层暂不支持直接在网页叠加显示，可在最终导出成片中查看。`);
        }
        fitLayerStack();
      }
      function fitLayerStack() {
        if (!layerStack || !compVid) return;
        const vw = compVid.videoWidth, vh = compVid.videoHeight;
        const wrap = document.getElementById("composite-player-wrap");
        if (!vw || !vh || !wrap) return;
        const cw = wrap.clientWidth, ch = wrap.clientHeight;
        const scale = Math.min(cw / vw, ch / vh);
        const w = vw * scale, h = vh * scale;
        layerStack.style.width = w + "px";
        layerStack.style.height = h + "px";
        layerStack.style.left = ((cw - w) / 2) + "px";
        layerStack.style.top = ((ch - h) / 2) + "px";
      }
      function syncLayers() {
        if (!layerEls.length || !compVid) return;
        const t = compVid.currentTime;
        const playing = !compVid.paused;
        for (const { def, el } of layerEls) {
          const start = (def.startMs || 0) / 1000;
          const end = (def.endMs || 0) / 1000;
          const on = t >= start - 0.04 && t < end + 0.04;
          el.style.opacity = on ? "1" : "0";
          if (!on) { if (!el.paused) el.pause(); continue; }
          const local = Math.max(0, t - start);
          if (Math.abs(el.currentTime - local) > 0.12) {
            try { el.currentTime = local; } catch {}
          }
          if (playing && el.paused) el.play().catch(() => {});
          if (!playing && !el.paused) el.pause();
        }
      }
      if (compVid) {
        // 成片通道的字幕也按播放时间更新。此前只有 SVG/活舞台走 updateStageSubtitle，
        // 切到成片后字幕停在旧句子或干脆不显示 —— 用户看到的"字幕不跟视频动"。
        compVid.addEventListener("timeupdate", () => {
          updateStageSubtitle(null, compVid.currentTime);
          syncDemoProxyAt(compVid.currentTime, !compVid.paused);
        });
        compVid.addEventListener("seeked", () => {
          updateStageSubtitle(null, compVid.currentTime);
          syncDemoProxyAt(compVid.currentTime, !compVid.paused);
        });
        compVid.addEventListener("loadedmetadata", fitLayerStack);
        compVid.addEventListener("loadeddata", fitLayerStack);
        compVid.addEventListener("timeupdate", syncLayers);
        compVid.addEventListener("seeked", syncLayers);
        compVid.addEventListener("pause", () => { syncLayers(); syncDemoProxyAt(compVid.currentTime, false); });
        for (const ev of ["play", "pause", "seeked", "ratechange"]) {
          compVid.addEventListener(ev, syncAltAudioState);
        }
        window.addEventListener("resize", fitLayerStack);
        (function layerLoop() {
          if (compVid && !compVid.paused) syncLayers();
          requestAnimationFrame(layerLoop);
        })();
        initLayers().catch(() => {});
      }
      if (spkVid) {
        for (const ev of ["play", "pause", "seeked", "ratechange"]) {
          spkVid.addEventListener(ev, syncAltAudioState);
        }
      }
      ensureAudioTrackUrls().then(syncAltAudioState).catch(() => {});

      // 尝试读取已有的 choreography.json（或内联演示数据）
      if (window.__INLINE_CHOREO__ && window.__INLINE_CHOREO__.screens) {
        state.choreoOverrides = window.__INLINE_CHOREO__.screens;
      } else if (review && typeof review.readText === "function") {
        try {
          const choreoDoc = JSON.parse(await review.readText(CHOREO_REL, { optional: true }));
          if (choreoDoc && choreoDoc.screens) {
            state.choreoOverrides = choreoDoc.screens;
          }
        } catch {}
      }

      globalTotalDurationMs = data.totalDurationMs || 0;
      allScreensList = [];
      const box = document.getElementById("steps");
      box.replaceChildren();
      let drawn = 0, failed = 0;
      let firstStepEl = null, firstStepData = null;

      for (const ch of data.chapters) {
        const h = document.createElement("div");
        h.className = "step chapter-header";
        h.innerHTML = `<div class="step-id">chapter ${ch.id}</div><div class="step-meta">${ch.title}</div>`;
        box.appendChild(h);
        for (const st of ch.steps) {
          const el = document.createElement("div");
          el.className = "step";
          el.dataset.stepId = st.id;
          el.tabIndex = 0;
          el.setAttribute("role", "button");
          el.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); el.click(); }
          });
          st.chapterId = ch.id;
          st.domEl = el;
          allScreensList.push(st);
          try {
            const cue = cueRangeOf(st);
            el.innerHTML = `
              <div class="step-id">
                <span class="step-id-main">${st.id}</span>
                <span>${fmt(st.durationMs)}${cue ? ` · cue ${cue[0] + 1}-${cue[1] + 1}` : ""}</span>
                ${st.sourcePageKey ? `<span class="step-badge">SVG</span>` : ""}
              </div>
              <div class="step-caption">${st.caption || ""}</div>
              <div class="step-meta">${st.screenIntent || ""}</div>`;
          } catch (error) {
            failed += 1;
            el.innerHTML = `<div class="step-id">${st.id || "?"} · 加载异常</div>
              <div class="step-caption">这一屏内容暂无法显示</div>`;
          }
          el.addEventListener("click", async () => {
            document.querySelectorAll(".step").forEach((e) => e.classList.remove("active"));
            el.classList.add("active");
            state.chapter = ch.id;
            state.step = st.id;
            state.stepIndex = st.step;
            state.durationMs = st.durationMs;
            state.caption = st.caption || "";
            document.getElementById("fb-step").textContent = st.id;
            setMode("step");
            await loadScreenSvg(st, true);
            if (spkVid && !spkVid.hidden && spkVid.src) {
              const svgEl = document.querySelector("#svg-stage-host > svg");
              if (svgEl) playWithSpeakerOrTimers(st, svgEl, null, false);
            }
            const live = window.__REVIEW_DATA__?.media?.liveStage;
            if (live && live.url) {
              // 活 composition：切到活舞台、跳到这一屏起点、播起来。这就是
              // 「工程态审阅」—— 没有渲染、没有等待，演的正是工程态的源。
              setStageViewMode("live");
              liveStage.seek((st.startMs || 0) / 1000);
              liveStage.play();
            } else if (compVid && compVid.getAttribute("src")) {
              // 点一屏就是审这一屏：切到成片舞台、跳到这一屏起点、播到这一屏结束为止。
              // 原来只 seek 不 play，舞台又还停在静态 SVG 页上 —— 点下去是一张静止帧。
              const from = (st.startMs || 0) / 1000;
              const till = (st.endMs || 0) / 1000;
              setStageViewMode("composite");
              try { compVid.currentTime = from; } catch {}
              if (typeof compVid.__stopAtStepEnd === "function") {
                compVid.removeEventListener("timeupdate", compVid.__stopAtStepEnd);
              }
              compVid.__stopAtStepEnd = () => {
                if (compVid.currentTime >= till) {
                  compVid.pause();
                  compVid.removeEventListener("timeupdate", compVid.__stopAtStepEnd);
                  compVid.__stopAtStepEnd = null;
                }
              };
              compVid.addEventListener("timeupdate", compVid.__stopAtStepEnd);
              compVid.play();
            }
          });
          if (!firstStepData) {
            firstStepEl = el;
            firstStepData = { ch, st };
          }
          box.appendChild(el);
          drawn += 1;
        }
      }
      if (failed) {
        noteStaleFree(`有 ${failed} 屏内容加载异常（其余 ${drawn - failed} 屏正常），请回对话重新整理后再继续审片。`);
      }

      renderScrubberMarkers();
      updateScrubberDisplay(0);

      // 初始把第一屏的 SVG 预览画在舞台上（注意：不改变 fbMode 默认的 "overall"，也不给 .step 加 .active，确保测试契约 100% 成立！）
      if (firstStepData) {
        // 走 switchToScreen 而不是直接 loadScreenSvg：否则状态里已经选中第一屏、左侧列表
        // 却没有任何高亮，看起来像两套状态。
        switchToScreen(firstStepData.st, true);
      }
      return data;
    }

    async function onHostChanged() {
      let data;
      try { data = JSON.parse(await review.readText(TIMELINE_REL)); } catch {
        staleNoted = true;
        noteStaleFree("作品文件有更新，无法核对当前时间轴。", { withReload: true });
        return;
      }
      if (timelineFingerprint === null) { timelineFingerprint = fingerprint(data); return; }
      if (fingerprint(data) === timelineFingerprint) {
        try {
          const next = JSON.parse(await review.readText("review/review_data.json", { optional: true }));
          if (next && typeof next === "object") {
            // Host notifications also cover media/SVG files, which cannot be
            // verified by comparing only the timeline document. A snapshot
            // exists, so any watched-file tick requires a rebuilt review.
            staleNoted = true;
            noteStaleFree(
              next.snapshot === loadedReviewSnapshot
                ? "作品内容已更新，请重新加载页面后再核对画面。"
                : "作品版本已更新，请重新加载页面后再核对画面。",
              { withReload: true },
            );
            return;
          }
        } catch {
          // Projects without review_data.json only have the timeline signal.
          return;
        }
      }
      staleNoted = true;
      noteStaleFree("时间轴已经变了，当前显示的是上一版内容。请先点「重新加载」获取最新版后再提交。",
        { withReload: true });
    }

    async function collectRecords() {
      try {
        const text = await review.readText(submissionsRel, { optional: true });
        if (text) {
          const doc = JSON.parse(text);
          if (doc && Array.isArray(doc.records)) return doc.records;
          if (Array.isArray(doc)) return doc;
        }
      } catch {}
      return [];
    }

    function buildRecord(text) {
      const stale = staleNoted ? { stale: true, ...(loadedTimelineId ? { stale_timeline: loadedTimelineId } : {}) } : {};
      const common = {
        type: document.getElementById("fb-type").value,
        text,
        status: "open",
        // 记下这一条是冲着哪一版审阅面写的：重建之后旧意见自动归入历史。
        buildId: window.__REVIEW_DATA__?.buildId || null,
        batchId: "review-" + new Date().toISOString().slice(0, 10) + "-1",
        createdAt: new Date().toISOString(),
        snapshot: window.__REVIEW_DATA__?.snapshot || loadedTimelineId,
        playbackTimeMs: stageViewMode === "live" ? Math.round(liveStage.currentMs) : Math.round((document.getElementById("composite-video-player").currentTime ||
          document.getElementById("stage-speaker-video").currentTime || 0) * 1000),
      };
      if (fbMode === "overall") {
        // adjustments 是**所有**记录都要带的字段：整片意见同样可能伴随画布微调，
        // 少了它，不选屏时做的改动就没有出口（2026-10-16 的实际事故）。
        return { phase: "overall", ...stale, ...common, adjustments: collectAdjustments() };
      }
      const active = document.querySelector(".step.active .step-caption");
      return {
        unitId: state.currentScreenObj?.unitId || window.__REVIEW_DATA__?.binding?.units?.find(u => u.sourceId === state.step && u.chapterId === state.chapter)?.unitId || null,
        chapterId: state.chapter,
        stepId: state.step,
        animationAnchor: (() => {
          const t = common.playbackTimeMs / 1000;
          const cues = state.currentScreenObj?.cues || (window.__REVIEW_DATA__?.captions || [])
            .filter(c => c.startMs >= (state.currentScreenObj?.startMs || 0) && c.startMs < (state.currentScreenObj?.endMs || 0))
            .map(c => ({ relStartSec: c.start - (state.currentScreenObj?.startMs || 0) / 1000 }));
          let index = -1;
          cues.forEach((c, i) => { if (t >= (state.currentScreenObj.startMs || 0) / 1000 + (c.relStartSec || 0)) index = i; });
          return { stepId: state.step, cueIndex: index < 0 ? null : index, timeMs: common.playbackTimeMs };
        })(),
        stepIndex: state.stepIndex,
        caption: active ? active.textContent : "",
        durationMs: state.durationMs,
        ...stale,
        ...common,
        adjustments: collectAdjustments(),
      };
    }

    async function writeSubmissionsDoc(records) {
      const doc = {
        contract_version: "video-craft-review-submissions/1.0.0",
        surface: "video-craft/visual",
        updated_at: new Date().toISOString(),
        records,
      };
      if (Object.keys(state.choreoOverrides).length > 0) {
        doc.choreography_overrides = state.choreoOverrides;
      }
      if (Object.keys(state.svgEdits).length > 0) {
        doc.svg_edits = state.svgEdits;
      }
      await review.write(doc);
    }

    document.getElementById("fb-text").addEventListener("focus", pauseGlobalPlayback);
    let saving = false;
    async function save() {
      if (saving) return;
      if (!review) {
        label("保存失败（连接尚未就绪）——文字仍在输入框里，没有丢", "error");
        return;
      }
      if (fbMode === "step" && !state.step) {
        label("「当前屏」要先点左边一屏；只想说整片就切到左边的「整片意见」", "dirty");
        return;
      }
      const text = document.getElementById("fb-text").value.trim();
      if (!text) { label("先写一点反馈再保存", "dirty"); return; }

      const saveBtn = document.getElementById("fb-save");
      saving = true;
      saveBtn.disabled = true;
      label("保存中…", "dirty");
      try {
        const records = await collectRecords();
        const record = buildRecord(text);
        records.push(record);
        await writeSubmissionsDoc(records);
        cachedRecords = records;
        renderHistoryList();
        const now = new Date();
        const hhmmss = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        let wakeNote = " · 未核对";
        try {
          const wakeOpts = { unit: fbMode === "overall" ? "整片" : record.stepId };
          const result = await review.wake(wakeOpts);
          if (result && (result.verified || result.Delivered)) {
            wakeNote = " · 已送达";
          } else if (result && result.woke === false) {
            wakeNote = " · 已保存，回对话继续即可";
          }
        } catch (err) {
          wakeNote = " · 未送达";
        }
        label(`已写入 · ${hhmmss} · 本批 ${records.length} 条${wakeNote}`, "ok");
        if (staleNoted) noteStaleFree("内容已更新，请刷新。", { withReload: true });
        document.getElementById("fb-text").value = "";
        await clearDraft();
      } catch (e) {
        label(`保存失败：${e.message}`, "error");
      } finally {
        saving = false;
        saveBtn.disabled = !review;
      }
    }

    document.getElementById("fb-mode").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-mode]");
      if (btn) setMode(btn.getAttribute("data-mode"));
    });
    document.getElementById("mode-overall").addEventListener("click", () => setMode("overall"));
    document.getElementById("mode-step").addEventListener("click", () => setMode("step"));
    setMode("overall");

    document.getElementById("fb-text").addEventListener("input", () => {
      label("尚未提交 · 正在保存草稿", "dirty");
      clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 300);
    });
    document.getElementById("fb-type").addEventListener("change", saveDraft);

    document.getElementById("fb-save").addEventListener("click", save);
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        save();
      }
    });

    /* ---- 舞台提升：与初始化成败无关 ----
     * 这一段原先挂在初始化 IIFE 的最后一句。前面任何一句 await 抛错，它就永远不执行，
     * 页面静静停在标记给的静态 SVG 舞台上 —— 而且看门狗也不会响（attach 根本没被调用）。
     * 舞台该显示什么只取决于**数据**，不取决于初始化跑没跑完，所以它独立执行一次；
     * 初始化的问题另行走 noteStaleFree，页面不再无声无息。 */
    function promoteStage() {
      if (stageViewMode !== "svg") return;          // 已经提升过就别再动
      const liveMedia = window.__REVIEW_DATA__ && window.__REVIEW_DATA__.media
        ? window.__REVIEW_DATA__.media.liveStage : null;
      if (liveMedia && liveMedia.url) {
        setStageViewMode("live");                   // 活 composition 优先：工程态的直接体现
      } else if (window.__REVIEW_DATA__?.mode === "speaker_only"
                 || window.__REVIEW_DATA__?.media?.compositeVideo) {
        setStageViewMode("composite");
      }
      // 都没有：留在标记给的默认（SVG 静态页），不假装能播
    }
    promoteStage();

    (async () => {
      if (!window.ReviewBridge) {
        label("离线", "error");
        return;
      }
      try {
        review = await ReviewBridge.connect();
        window.__vcReview = review;
      } catch (error) {
        label("离线", "error");
        return;
      }

      const live = window.__REVIEW_DATA__?.media?.liveStage;
      if (live) {
        await liveStage.attach(live.url);
        liveStage.watchdog();
        setTimeout(() => { try { liveStage.seek(4); } catch (e) {} }, 500);
      }
      submissionsRel = await resolveSubmissionsRel();
      setMode("overall");
      document.getElementById("fb-save").disabled = false;
      label("已连接", "ok");
      if (typeof review.on === "function") {
        review.on("changed", () => { onHostChanged(); });
      }
      cachedRecords = await collectRecords();
      renderHistoryList();
      await restoreDraft();
      await loadTimeline();
      ensureAudioTrackUrls().catch(() => {});
      finishDraftRestore();
      if (state.pendingDraftStep) {
        const target = [...document.querySelectorAll(".step")].find(el => el.dataset.stepId === state.pendingDraftStep);
        if (target) target.click();
        state.pendingDraftStep = null;
      }
      promoteStage();
    })().catch((err) => {
      // 初始化失败必须看得见。它原先是一条静默的未处理 rejection：分屏清单少几屏、
      // 舞台停在静态页、看门狗也不响 —— 全都看不出原因（第 33 条的同一条命）。
      try {
        noteStaleFree("初始化失败：" + (err && err.message ? err.message : String(err)));
      } catch (e) { /* 连提示都写不出去也不能再抛 */ }
      if (window.console) console.error("review-init-failed", err);
    });
  </script>

</body>
</html>
