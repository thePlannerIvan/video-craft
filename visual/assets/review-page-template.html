<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>逐画面审阅</title>
  <!--
    审阅桥的注入点＝下面单独一行那个双花括号标记。**这里不放桥的副本**：宿主 serve 时把这个
    标记**原地**换成桥本身（有插件时内联源码；无插件时给 base + 一个外链脚本）。
    ⚠️ 标记必须**裸着独占一行**，全页**只许出现一次**。
  -->
{{REVIEW_BRIDGE}}
  <style>
    /*__DSH_TOKENS__*/
    :root {
      --bg-app: #0d0f14;
      --bg-panel: #141720;
      --bg-card: #1b1f2b;
      --bg-card-hover: #232838;
      --bg-input: #0f1219;
      --border: #282e3e;
      --border-strong: #3a4258;
      --text: #eef0f6;
      --text-secondary: #a3acc2;
      --text-muted: #6e778f;
      --accent: #e43d1e;
      --accent-soft: rgba(228, 61, 30, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.18);
      --green: #10b981;
      --radius: 8px;
      --font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* 顶部全局导航栏（精炼无冗余文字） */
    header.top {
      height: 46px;
      flex: 0 0 46px;
      padding: 0 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      font: 800 10px/1 var(--font-mono);
      letter-spacing: 0.1em;
      padding: 4px 7px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
    }
    h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.01em; }
    h1 #project-name { color: var(--amber); font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; margin-left: 4px; }
    .top-right { display: flex; align-items: center; gap: 8px; }
    .stage-switch {
      display: inline-flex;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .stage-switch button {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 4px 11px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .stage-switch button.active {
      background: var(--blue);
      color: #fff;
    }
    .reload {
      flex: 0 0 auto;
      font-size: 12px;
      line-height: 1;
      color: var(--text-secondary);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 6px;
      padding: 6px 10px;
      transition: all 0.15s;
    }
    .reload:hover { color: var(--text); border-color: var(--blue); }

    /* 主三栏工作台布局：左分屏轨 (236px) + 中央 16:9 舞台 (最大化) + 右侧批注栏 (320px) */
    .layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 320px;
      gap: 0;
    }

    /* 左侧栏：分屏列表 (#steps) */
    .side-left {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-head {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .steps {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px;
    }
    .steps::-webkit-scrollbar { width: 5px; }
    .steps::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* 每一步是一张有边界的卡：原先只有透明边框 + 3px 间距，逐条读起来连成一片，
       分不清哪一行属于哪一屏。 */
    .step {
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-panel);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .step:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .step.active {
      background: var(--accent-soft);
      border-color: var(--blue);
    }
    .step.chapter-header {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-strong);
      border-radius: 0;
      cursor: default;
      padding: 8px 4px 5px;
      margin-top: 6px;
    }
    .step-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--amber);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .step-id .step-id-main {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .step.chapter-header .step-id { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .step-caption { font-size: 13px; color: var(--text); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .step-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
    .step-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* 中央舞台区 */
    .center-stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-app);
      overflow: hidden;
    }
    .tool-btn {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 4px 9px;
      font-size: 11.5px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .tool-btn:hover { color: var(--text); border-color: var(--border-strong); }
    .tool-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tool-btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* 16:9 画布视口：严格锁定 16:9 比例，不设 max-height 防止 flex 压缩变形导致黑边或错位 */
    .player-box {
      position: relative;
      margin: 10px auto 8px;
      background: #141413;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: min(calc(100% - 24px), calc((100vh - 235px) * 16 / 9));
      flex: 0 0 auto;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    #svg-stage-wrap {
      position: absolute;
      inset: 0;
      background: #141413;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #svg-stage-wrap[hidden] { display: none; }
    #svg-stage-host {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #svg-stage-host > svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #stage-speaker-video {
      position: absolute;
      left: 0;
      top: 0;
      width: 31.6667%;
      height: 100%;
      object-fit: cover;
      z-index: 4;
      background: #000;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 6px 0 20px rgba(0, 0, 0, 0.38);
    }
    #stage-speaker-video[hidden] { display: none; }
    #speaker-time-pill {
      position: absolute;
      left: 10px;
      top: 10px;
      bottom: auto;
      z-index: 6;
      background: rgba(13, 15, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f59e0b;
      font: 700 10.5px/1 var(--font-mono);
      padding: 3px 7px;
      border-radius: 4px;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    #speaker-time-pill[hidden] { display: none; }

    /* 舞台浮动单行药丸字幕 (底端居中，确保不遮挡主画面内容与人像) */
    #canvas-caption-layer {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      background: rgba(18, 20, 26, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      max-width: 86%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #canvas-caption-layer[hidden] { display: none; }
    /* 药丸是 border-radius:9999px：任何超长字符串都会把它撑成椭圆，封个顶 */
    #canvas-caption-layer { max-width: min(86%, 900px); }
    #canvas-caption-text {
      font-size: clamp(13px, 1.7vw, 19px);
      font-weight: 700;
      color: #FAF8F5;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* 实时预览 / 成片的内嵌容器 */
    #live-stage-wrap, #composite-player-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 5;
    }
    #live-stage-wrap[hidden], #composite-player-wrap[hidden] { display: none; }
    #live-stage-frame { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    #live-stage-note {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--text); text-align: center; padding: 24px;
    }
    #live-stage-note[hidden] { display: none; }
    #composite-video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    /* 覆盖层预览：页面自己对同一份源做合成，不必为了改一层重渲整片。
       尺寸由 fitLayerStack() 按视频实际显示区域算，避免 object-fit:contain
       留下的黑边让层错位。 */
    #layer-stack {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    #layer-stack[hidden] { display: none; }
    #layer-stack > video.vc-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 60ms linear;
    }
    #composite-empty-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      background: #0f1219;
    }
    #composite-empty-placeholder[hidden] { display: none !important; }

    /* 完整成片预览影院模式：放大视频视口 */
    body.workspace-composite .player-box {
      width: min(calc(100% - 24px), calc((100vh - 120px) * 16 / 9));
      margin: 16px auto;
    }

    /* 全局视听播放与时间轴 Scrubber 操控台 */
    .global-transport-bar {
      margin: 0 12px 6px;
      flex: 0 0 auto;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .transport-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 9px;
      font-size: 11.5px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.12s;
    }
    .transport-btn:hover { background: var(--bg-card-hover); border-color: var(--blue); }
    .transport-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .transport-btn.primary:hover { background: #2563eb; }
    .transport-time {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--amber);
      white-space: nowrap;
      min-width: 110px;
    }
    #stage-mode-chip {
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
      color: var(--amber); border: 1px solid currentColor; border-radius: 999px;
      padding: 2px 9px; white-space: nowrap;
    }
    body[data-stage="live"] #stage-mode-chip { color: var(--lime); }
    .timeline-scrubber-wrap {
      flex: 1 1 auto;
      min-width: 80px;
      position: relative;
      cursor: pointer;
      padding: 6px 0;
    }
    .timeline-track {
      height: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 3px;
      position: relative;
      overflow: visible;
    }
    .timeline-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--amber));
      border-radius: 3px;
      pointer-events: none;
    }
    .timeline-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--amber);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      pointer-events: none;
      transition: transform 0.1s ease;
    }
    .timeline-scrubber-wrap:hover .timeline-thumb {
      transform: translate(-50%, -50%) scale(1.25);
    }
    .timeline-markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .timeline-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.22);
    }

    /* 右侧栏：已提意见列表 + 反馈输入区 */
    .side-right {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .history-box {
      flex: 1 1 auto;
      min-height: 100px;
      overflow-y: auto;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .fb-history {
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }
    .fb-history > summary {
      cursor: pointer;
      font-size: 11px;
      color: var(--text-muted);
      list-style: none;
      padding: 4px 2px;
    }
    .fb-history > summary:hover { color: var(--text-secondary); }
    .fb-history .fb-card { opacity: 0.72; }
    .history-empty {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.55;
      padding: 10px 8px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
    /* 用 token，而不是硬编码深色 + !important —— 那是这一栏看起来「突兀、不像这一页」的
       原因：它连明色主题下都维持深底。 */
    .fb-card {
      padding: 11px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 8px;
    }
    .fb-card.overall-card {
      border-color: color-mix(in srgb, var(--amber) 38%, var(--border));
      background: color-mix(in srgb, var(--amber) 7%, var(--bg-card-hover));
    }
    .fb-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .fb-card-badge-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fb-card-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--blue);
      border: 1px solid var(--border-strong);
    }
    .fb-card.overall-card .fb-card-badge {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }
    .fb-card-type-tag {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .fb-card-del {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      transition: all 0.12s;
    }
    .fb-card-del:hover {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .fb-card-body {
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .fb-card-quote {
      margin-top: 6px;
      padding: 4px 8px;
      background: var(--bg-input);
      border-left: 2px solid var(--border-strong);
      border-radius: 0 4px 4px 0;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fb-card-time {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-muted);
      text-align: right;
    }

    /* 反馈撰写区（保留全部自动化测试契约 ID） */
    .feedback {
      flex: 0 0 auto;
      padding: 10px 12px;
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .mode { display: flex; gap: 5px; }
    .mode-tab {
      flex: 1 1 50%;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    .mode-note { font-size: 10.5px; line-height: 1.4; color: var(--text-muted); }
    #fb-type {
      width: 100%;
      padding: 5px 7px;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 11.5px;
    }
    #fb-text {
      width: 100%;
      min-height: 64px;
      padding: 7px 9px;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      resize: vertical;
      font: inherit;
      font-size: 12px;
      line-height: 1.45;
    }
    #fb-text:focus { outline: none; border-color: var(--blue); }
    button#fb-save {
      padding: 7px 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 auto;
    }
    button#fb-save:hover:not(:disabled) { background: #2563eb; }
    button#fb-save:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    .save-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 7px;
    }
    #save-state { flex: 1 1 auto; font-size: 11px; line-height: 1.3; color: var(--text-muted); }
    #save-state.ok { color: var(--green); }
    #save-state.dirty { color: var(--amber); }
    #save-state.error { color: #ff7a7a; }
    #save-state.warn { color: var(--amber); }
    #stale-note {
      font-size: 11px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg-card-hover);
      border: 1px solid var(--border-strong);
      border-left: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 7px 10px;
    }
    #stale-note[hidden] { display: none; }
    #stale-note button {

        id: el.id || `step-${stepNum}`,
        step: stepNum,
        anim: over.anim || el.getAttribute('data-anim') || 'stagger-cards',
        camera: over.camera || el.getAttribute('data-camera') || 'none',
        subDelayMs: over.subDelayMs !== undefined ? Number(over.subDelayMs) : Number(el.getAttribute('data-sub-delay') || 0),
        cue: over.cue || el.getAttribute('data-cue') || '',
        relStartSec: over.relStartSec !== undefined ? Number(over.relStartSec) : (el.getAttribute('data-rel-start') ? Number(el.getAttribute('data-rel-start')) : undefined),
        startSec: over.startSec !== undefined ? Number(over.startSec) : undefined,
        nested: Boolean(el.parentElement && el.parentElement.closest('[data-step]')),
        el
      };
    });
  }

  function clearTickers(svgRoot) {
    const list = activeTickers.get(svgRoot);
    if (list && list.length) {
      list.forEach(id => cancelAnimationFrame(id));
    }
    activeTickers.set(svgRoot, []);
  }

  function cancelAll(svgRoot) {
    if (!svgRoot) return;
    clearTickers(svgRoot);
    svgRoot.querySelectorAll('.vc-transient-overlay').forEach(node => node.remove());
    svgRoot.querySelectorAll('[data-vc-orig-text]').forEach(node => {
      node.textContent = node.getAttribute('data-vc-orig-text');
    });
    svgRoot.querySelectorAll('[data-step], [data-step] *').forEach(node => {
      if (typeof node.getAnimations === 'function') {
        node.getAnimations().forEach(a => a.cancel());
      }
      node.style.clipPath = '';
      node.style.transform = '';
      node.style.opacity = '';
      node.style.filter = '';
    });
  }

  /**
   * Compute safe camera matrix `{ scale, tx, ty }` for 1920x1080 canvas.
   * Zooms smoothly around the active step's center while gently gliding 20% toward
   * the stage focal point so cards never get clipped or collide with the speaker zone.
   */
  function computeCameraTarget(svgRoot, item, mode) {
    const W = 1920, H = 1080;
    const speakerW = Number((svgRoot && svgRoot.getAttribute('data-speaker-width')) || 0);
    // When left speaker column is present (split-stage 16:9), never shift or pan the canvas
    // so right-stage graphics never get occluded by the speaker column.
    if (speakerW > 0 || !mode || mode === 'none' || !item || !item.el) {
      return { scale: 1, tx: 0, ty: 0 };
    }
    let box = { x: 660, y: 200, width: 1120, height: 680 };
    try {
      const b = item.el.getBBox();
      if (b && b.width > 20 && b.height > 20) box = b;
    } catch (_) { /* fallback */ }

    let scale = 1.04;
    let cx = box.x + box.width / 2;
    let cy = box.y + box.height / 2;

    if (mode === 'focus-left') {
      scale = 1.05;
      cx = box.x + Math.min(box.width * 0.35, 340);
    } else if (mode === 'focus-right') {
      scale = 1.05;
      cx = box.x + Math.max(box.width * 0.65, box.width - 340);
    } else if (mode === 'zoom-center') {
      scale = 1.04;
      cx = W * 0.5;
      cy = H * 0.5;
    } else if (mode === 'focus-step') {
      scale = 1.045;
    }

    const tx = Math.round(Math.max(W * (1 - scale), Math.min(0, cx * (1 - scale))));
    const ty = Math.round(Math.max(H * (1 - scale), Math.min(0, cy * (1 - scale))));

    return {
      scale: Number(scale.toFixed(3)),
      tx,
      ty
    };
  }

  function animateCameraWAAPI(svgRoot, item, resolvedStep) {
    const stage = ensureCameraStage(svgRoot);
    if (!stage) return;
    const mode = resolvedStep === 'all' ? 'none' : (item ? item.camera : 'none');
    const { scale, tx, ty } = computeCameraTarget(svgRoot, item, mode);
    const nextTransform = scale === 1 && tx === 0 && ty === 0
      ? 'translate(0px, 0px) scale(1)'
      : `translate(${tx}px, ${ty}px) scale(${scale})`;

    const prevTransform = stage.getAttribute('data-vc-cam-transform') || 'translate(0px, 0px) scale(1)';
    stage.setAttribute('data-vc-cam-transform', nextTransform);

    if (typeof stage.animate === 'function' && prevTransform !== nextTransform) {
      stage.animate(
        [{ transform: prevTransform }, { transform: nextTransform }],
        { duration: Math.round(620 * speedMultiplier), easing: EASE_CAMERA, fill: 'both' }
      );
    } else {
      stage.style.transform = nextTransform;
    }
  }

  /**
   * Inject a temporary SVG cursor + click ripple for `cursor-click` primitive.
   */
  function spawnCursorClickOverlay(el, opts, subDelay) {
    let box = { x: 960, y: 540, width: 300, height: 120 };
    try {
      const targetNode = el.querySelector('.anim-node, .anim-badge, .anim-endpoint, .anim-card, .anim-body') || el;
      const b = targetNode.getBBox();
      if (b && b.width > 10) box = b;
    } catch (_) { /* ignore */ }

    const tx = Math.round(box.x + box.width * 0.52);
    const ty = Math.round(box.y + box.height * 0.52);
    const startX = tx + 110;
    const startY = ty + 85;

    const ns = 'http://www.w3.org/2000/svg';
    const layer = document.createElementNS(ns, 'g');
    layer.setAttribute('class', 'vc-transient-overlay');
    layer.style.pointerEvents = 'none';

    const ripple = document.createElementNS(ns, 'circle');
    ripple.setAttribute('cx', String(tx));
    ripple.setAttribute('cy', String(ty));
    ripple.setAttribute('r', '24');
    ripple.setAttribute('fill', 'none');
    ripple.setAttribute('stroke', '#E43D1E');
    ripple.setAttribute('stroke-width', '3');
    ripple.style.opacity = '0';
    ripple.style.transformOrigin = `${tx}px ${ty}px`;

    const cursor = document.createElementNS(ns, 'g');
    cursor.innerHTML = `
      <path d="M 0,0 L 0,26 L 7,20 L 12.5,31 L 17,28.5 L 11.5,17.5 L 20.5,17.5 Z"
            fill="#141413" stroke="#FAF8F5" stroke-width="2" stroke-linejoin="round"/>
    `;

    layer.appendChild(ripple);
    layer.appendChild(cursor);
    el.appendChild(layer);

    if (typeof cursor.animate === 'function') {
      cursor.animate([
        { opacity: 0, transform: `translate(${startX}px, ${startY}px) scale(1.1)` },
        { opacity: 1, transform: `translate(${tx}px, ${ty}px) scale(1)`, offset: 0.48 },
        { opacity: 1, transform: `translate(${tx}px, ${ty}px) scale(0.85)`, offset: 0.65 },
        { opacity: 1, transform: `translate(${tx}px, ${ty}px) scale(1)`, offset: 0.80 },
        { opacity: 0, transform: `translate(${tx + 18}px, ${ty + 22}px) scale(0.95)` }
      ], opts(660, EASE_OUT, subDelay));

      ripple.animate([
        { opacity: 0, transform: 'scale(0.25)' },
        { opacity: 0.9, transform: 'scale(0.6)', offset: 0.35 },
        { opacity: 0, transform: 'scale(1.8)' }
      ], opts(420, EASE_OUT, subDelay + 310));
    }
  }

  /**
   * Run numeric ticker count-up on text elements containing numbers.
   */
  function runNumberTickers(svgRoot, el, durationMs, delayMs) {
    const texts = Array.from(el.querySelectorAll('text.anim-count, [data-count-to], text'));
    const numRegex = /(-?\d+(?:\.\d+)?)/;
    const targets = texts.filter(t => t.classList.contains('anim-count') || numRegex.test(t.textContent || ''));
    if (!targets.length) return;

    const rafList = activeTickers.get(svgRoot) || [];
    targets.forEach(node => {
      const raw = node.getAttribute('data-vc-orig-text') || node.textContent || '';
      node.setAttribute('data-vc-orig-text', raw);
      const match = raw.match(numRegex);
      if (!match) return;
      const targetVal = parseFloat(match[1]);
      const isFloat = match[1].includes('.');
      const decimals = isFloat ? (match[1].split('.')[1] || '').length : 0;
      const prefix = raw.slice(0, match.index);
      const suffix = raw.slice((match.index || 0) + match[1].length);

      const startTime = performance.now() + delayMs * speedMultiplier;
      const totalDur = Math.max(240, durationMs * speedMultiplier);

      function tick(now) {
        if (now < startTime) {
          node.textContent = `${prefix}${isFloat ? (0).toFixed(decimals) : '0'}${suffix}`;
          rafList.push(requestAnimationFrame(tick));
          return;
        }
        const p = Math.min(1, (now - startTime) / totalDur);
        const eased = 1 - Math.pow(1 - p, 3);
        const cur = targetVal * eased;
        node.textContent = `${prefix}${isFloat ? cur.toFixed(decimals) : Math.round(cur)}${suffix}`;
        if (p < 1) {
          rafList.push(requestAnimationFrame(tick));
        } else {
          node.textContent = raw;
        }
      }
      rafList.push(requestAnimationFrame(tick));
    });
    activeTickers.set(svgRoot, rafList);
  }

  /**
   * Run character-by-character typewriter effect on `.anim-typewriter` text nodes.
   */
  function runTypewriters(svgRoot, el, durationMs, delayMs) {
    const nodes = Array.from(el.querySelectorAll('text.anim-typewriter, [data-typewriter]'));
    if (!nodes.length) return;
    const rafList = activeTickers.get(svgRoot) || [];
    nodes.forEach((node, idx) => {
      const raw = node.getAttribute('data-vc-orig-text') || node.textContent || '';
      node.setAttribute('data-vc-orig-text', raw);
      const startTime = performance.now() + (delayMs + idx * 120) * speedMultiplier;
      const totalDur = Math.max(220, durationMs * speedMultiplier);
      function tick(now) {
        if (now < startTime) {
          node.textContent = '';
          rafList.push(requestAnimationFrame(tick));
          return;
        }
        const p = Math.min(1, (now - startTime) / totalDur);
        const nChars = Math.max(1, Math.round(raw.length * p));
        node.textContent = p < 1 ? raw.slice(0, nChars) + '▋' : raw;
        if (p < 1) rafList.push(requestAnimationFrame(tick));
      }
      rafList.push(requestAnimationFrame(tick));
    });
    activeTickers.set(svgRoot, rafList);
  }

  /**
   * Universal internal graphic choreography: animates paths, bars, nodes, rings,
   * scanners, and typewriters inside any step with multi-beat sequential timing (1.2s - 1.8s)
   * so diagrams evolve organically along with the spoken sentence.
   */
  function runInternalGraphicChoreography(svgRoot, el, opts, sub) {
    // 1. Vector path drawing (stroke-dashoffset) — sequential circuit tracing
    el.querySelectorAll('.anim-stroke, [pathLength="1"]').forEach((p, idx) => {
      p.style.strokeDasharray = '1';
      p.animate([
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0 }
      ], opts(720, EASE_OUT, sub + 120 + idx * 240));
    });

    // 2. Horizontal progress / meter bars (.anim-bar-h, .anim-fill)
    el.querySelectorAll('.anim-bar-h, .anim-fill').forEach((bar, idx) => {
      bar.style.transformBox = 'fill-box';
      bar.style.transformOrigin = '0% 50%';
      bar.animate([
        { transform: 'scaleX(0)' },
        { transform: 'scaleX(1)' }
      ], opts(1050, EASE_OUT, sub + 140 + idx * 220));
    });

    // 3. Vertical chart pillars (.anim-bar-v)
    el.querySelectorAll('.anim-bar-v').forEach((bar, idx) => {
      bar.style.transformBox = 'fill-box';
      bar.style.transformOrigin = '50% 100%';
      bar.animate([
        { opacity: 0, transform: 'scaleY(0.08)' },
        { opacity: 1, transform: 'scaleY(1)' }
      ], opts(780, EASE_SPRING, sub + 100 + idx * 220));
    });

    // 4. In-place diagram nodes & rings (.anim-node, .anim-ring, .anim-endpoint)
    el.querySelectorAll('.anim-node, .anim-ring, .anim-endpoint').forEach((node, idx) => {
      node.style.transformBox = 'fill-box';
      node.style.transformOrigin = '50% 50%';
      node.animate([
        { opacity: 0, transform: 'scale(0.82)' },
        { opacity: 1, transform: 'scale(1.03)', offset: 0.72 },
        { opacity: 1, transform: 'scale(1)' }
      ], opts(540, EASE_SPRING, sub + 80 + idx * 240));
    });

    // 5. Scanner / highlight beam (.anim-scan)
    el.querySelectorAll('.anim-scan').forEach((scan, idx) => {
      scan.animate([
        { opacity: 0, transform: 'translateX(-48px)' },
        { opacity: 1, offset: 0.25 },
        { opacity: 1, transform: 'translateX(0px)' }
      ], opts(880, EASE_OUT, sub + 120 + idx * 180));
    });

    // 6. Typewriter text (.anim-typewriter) — 1.35s character-by-character typing
    runTypewriters(svgRoot, el, 1350, sub + 80);

    // 7. Explicit counter text (.anim-count) — 1.35s numeric count-up
    if (el.querySelector('.anim-count, [data-count-to]')) {
      runNumberTickers(svgRoot, el, 1350, sub + 120);
    }
  }

  function playPrimitive(svgRoot, item) {
    const { el, anim, nested, subDelayMs = 0 } = item;
    const baseDelay = nested ? 180 : 0;
    const sub = Math.max(0, Number(subDelayMs) || 0);
    const opts = (dur, easing = EASE_OUT, extraDelay = 0) => ({
      duration: Math.round(dur * speedMultiplier),
      delay: Math.round((baseDelay + extraDelay) * speedMultiplier),
      easing,
      fill: 'both'
    });

    // Always trigger internal graphic sub-animations (strokes, bars, nodes, typewriters)
    runInternalGraphicChoreography(svgRoot, el, opts, sub);

    if (anim === 'meter-halt') {
      const bar = el.querySelector('.wipe-bar');
      if (bar) {
        bar.style.transformBox = 'fill-box';
        bar.style.transformOrigin = '50% 0%';
        bar.animate([{ transform: 'scaleY(0)', opacity: 0.2 }, { transform: 'scaleY(1)', opacity: 1 }], opts(260, EASE_OUT, 0));
      }
      const wall = el.querySelector('.anim-wall');
      if (wall) {
        wall.animate([
          { opacity: 0.3, transform: 'translateX(0px)' },
          { opacity: 1, transform: 'translateX(6px)', offset: 0.58 },
          { opacity: 1, transform: 'translateX(-2px)', offset: 0.80 },
          { opacity: 1, transform: 'translateX(0px)' }
        ], opts(380, EASE_OVERSHOOT, 240 + sub));
      }
      const badge = el.querySelector('.anim-badge');
      if (badge) {
        badge.style.transformBox = 'fill-box';
        badge.style.transformOrigin = '50% 50%';
        badge.animate([{ opacity: 0, transform: 'scale(0.82)' }, { opacity: 1, transform: 'scale(1)' }], opts(300, EASE_SPRING, 320 + sub));
      }
      runNumberTickers(svgRoot, el, 480, 60 + sub);
    } else if (anim === 'draw-stroke') {
      const body = el.querySelector('.anim-body, .anim-label');
      if (body) {
        body.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], opts(360, EASE_OUT, 0));
      }
    } else if (anim === 'cursor-wipe' || anim === 'bar-wipe') {
      const bar = el.querySelector('.wipe-bar');
      if (bar) {
        bar.style.transformBox = 'fill-box';
        bar.style.transformOrigin = '50% 0%';
        bar.animate([{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1 }], opts(280, EASE_OUT, 0));
      }
      const body = el.querySelector('.anim-body');
      if (body) {
        body.animate([
          { clipPath: 'inset(0 100% 0 0)', opacity: 0.35 },
          { clipPath: 'inset(0 0% 0 0)', opacity: 1 }
        ], opts(420, EASE_OUT, 30));
      }
      const subEl = el.querySelector('.anim-sub');
      if (subEl) {
        subEl.animate([{ opacity: 0 }, { opacity: 1 }], opts(320, EASE_OUT, 180));
      }
      const stamp = el.querySelector('.anim-stamp');
      if (stamp) {
        stamp.style.transformBox = 'fill-box';
        stamp.style.transformOrigin = '50% 50%';
        stamp.animate([{ opacity: 0, transform: 'scale(1.25)' }, { opacity: 1, transform: 'scale(1)' }], opts(280, EASE_OVERSHOOT, 320 + sub));
      }
    } else if (anim === 'slot-push' || anim === 'slot-expand') {
      const pushPx = Number(el.getAttribute('data-push') || 90);
      const left = el.querySelector('.slot-left');
      const right = el.querySelector('.slot-right');
      const core = el.querySelector('.slot-core');
      if (left) left.animate([{ transform: `translateX(${pushPx}px)` }, { transform: 'translateX(0px)' }], opts(460, EASE_OUT, 0));
      if (right) right.animate([{ transform: `translateX(-${pushPx}px)` }, { transform: 'translateX(0px)' }], opts(460, EASE_OUT, 0));
      if (core) {
        core.style.transformBox = 'fill-box';
        core.style.transformOrigin = '50% 50%';
        core.animate([{ opacity: 0, transform: 'scaleX(0.15)' }, { opacity: 1, transform: 'scaleX(1)' }], opts(440, EASE_SPRING, 40));
      }
    } else if (anim === 'polaroid-slap' || anim === 'z-stack-drop') {
      const units = el.querySelectorAll('.polaroid-unit, .anim-card');
      (units.length > 0 ? Array.from(units) : [el]).forEach((unit, uIdx) => {
        const uDelay = sub + uIdx * 140;
        unit.style.transformBox = 'fill-box';
        unit.style.transformOrigin = '50% 50%';
        unit.animate([
          { opacity: 0, clipPath: 'inset(0 100% 0 0)' },
          { opacity: 1, clipPath: 'inset(0 0% 0 0)' }
        ], opts(400, EASE_OUT, uDelay));
      });
    } else if (anim === 'stagger-cards' || anim === 'pop-card') {
      const cards = el.querySelectorAll('.anim-card');
      (cards.length > 0 ? Array.from(cards) : [el]).forEach((c, idx) => {
        c.style.transformBox = 'fill-box';
        c.style.transformOrigin = '50% 50%';
        c.animate([
          { opacity: 0, clipPath: 'inset(0 0 100% 0)' },
          { opacity: 1, clipPath: 'inset(0 0 0% 0)' }
        ], opts(380, EASE_OUT, sub + idx * 110));
      });
    } else if (anim === 'stamp-in') {
      const stamps = el.querySelectorAll('.anim-stamp, .anim-card');
      (stamps.length > 0 ? Array.from(stamps) : [el]).forEach((st, idx) => {
        st.style.transformBox = 'fill-box';
        st.style.transformOrigin = '50% 50%';
        st.animate([
          { opacity: 0, transform: 'scale(1.14)' },
          { opacity: 1, transform: 'scale(0.98)', offset: 0.72 },
          { opacity: 1, transform: 'scale(1)' }
        ], opts(320, EASE_OVERSHOOT, sub + idx * 110));
      });
    } else if (anim === 'paper-unroll') {
      const paper = el.querySelector('.anim-paper, .anim-card') || el;
      paper.animate([
        { clipPath: 'inset(0 100% 0 0)', opacity: 0.4 },
        { clipPath: 'inset(0 0% 0 0)', opacity: 1 }
      ], opts(440, EASE_OUT, sub));
    } else if (anim === 'cursor-click') {
      const targetCards = el.querySelectorAll('.anim-card, .anim-body, .anim-endpoint, .anim-stamp');
      (targetCards.length > 0 ? Array.from(targetCards) : [el]).forEach((t, idx) => {
        t.style.transformBox = 'fill-box';
        t.style.transformOrigin = '50% 50%';
        t.animate([
          { opacity: 0.35, transform: 'scale(0.97)' },
          { opacity: 0.65, transform: 'scale(0.95)', offset: 0.52 },
          { opacity: 1, transform: 'scale(1.02)', offset: 0.80 },
          { opacity: 1, transform: 'scale(1)' }
        ], opts(600, EASE_SPRING, sub + idx * 80));
      });
      spawnCursorClickOverlay(el, opts, sub);
    } else if (anim === 'number-ticker') {
      runNumberTickers(svgRoot, el, 620, sub + 40);
    } else if (anim === 'card-expand') {
      const targets = el.querySelectorAll('.anim-card');
      (targets.length > 0 ? Array.from(targets) : [el]).forEach((t, idx) => {
        t.animate([
          { opacity: 0, clipPath: 'inset(0 0 88% 0)' },
          { opacity: 1, clipPath: 'inset(0 0 0% 0)' }
        ], opts(440, EASE_OUT, sub + idx * 90));
      });
    } else if (anim === 'spotlight-sweep') {
      el.animate([
        { opacity: 0, clipPath: 'inset(0 100% 0 0)' },
        { opacity: 1, clipPath: 'inset(0 0% 0 0)' }
      ], opts(480, EASE_OUT, sub));
    }
  }

  function setStep(svgRoot, targetStep, animateTarget = true, options = {}) {
    if (!svgRoot) return { items: [], maxStep: 0, resolved: 0 };
    if (options.focusMode || options.steps) {
      setChoreography(svgRoot, options);
    }
    cancelAll(svgRoot);
    ensureCameraStage(svgRoot);

    const choreo = getChoreography(svgRoot);
    const focusMode = options.focusMode || choreo.focusMode || 'spotlight';
    const items = inspect(svgRoot);
    const maxStep = items.reduce((m, x) => Math.max(m, x.step), 0);
    const resolved = targetStep === 'all' ? maxStep : Number(targetStep);
    let activeItem = null;

    items.forEach(item => {
      if (item.step > resolved) {
        item.el.setAttribute('data-vc-state', 'hidden');
        item.el.style.opacity = '0';
      } else if (targetStep !== 'all' && item.step < resolved && focusMode === 'spotlight') {
        // Spotlight state machine: previous steps gently recede into context!
        item.el.setAttribute('data-vc-state', 'dimmed');
        item.el.style.opacity = '0.34';
        item.el.querySelectorAll('[pathLength="1"]').forEach(p => {
          p.style.strokeDasharray = '1';
          p.style.strokeDashoffset = '0';
        });
      } else {
        item.el.setAttribute('data-vc-state', 'active');
        item.el.style.opacity = '1';
        item.el.querySelectorAll('[pathLength="1"]').forEach(p => {
          p.style.strokeDasharray = '1';
          p.style.strokeDashoffset = '0';
        });
        if (item.step === resolved) {
          activeItem = item;
          if (animateTarget && targetStep !== 'all') {
            playPrimitive(svgRoot, item);
          }
        }
      }
    });

    animateCameraWAAPI(svgRoot, activeItem, targetStep);
    return { items, maxStep, resolved, focusMode, activeItem };
  }

  /**
   * Register seek-safe GSAP tweens on `tl` (`window.__timelines["main"]`)
   * for HyperFrames deterministic rendering.
   *
   * `stepConfigMap` can be either:
   *   - legacy `{ 1: 0.4, 2: 2.8, 3: 5.1 }` (step -> startSec)
   *   - v4 rich config `{ focusMode: 'spotlight', steps: { 1: { startSec: 0.4, anim: 'meter-halt', camera: 'focus-step', subDelaySec: 0.5 } } }`
   */
  function registerGsapTimeline(gsap, tl, svgRoot, stepConfigMap = {}) {
    if (!gsap || !tl || !svgRoot) return;
    const isRich = stepConfigMap && typeof stepConfigMap === 'object' && stepConfigMap.steps;
    const focusMode = isRich ? (stepConfigMap.focusMode || 'spotlight') : (svgRoot.getAttribute('data-focus-mode') || 'spotlight');
    const stepEntries = isRich ? stepConfigMap.steps : stepConfigMap;

    if (isRich) {
      setChoreography(svgRoot, stepConfigMap);
    }

    const stage = ensureCameraStage(svgRoot);
    if (stage) {
      gsap.set(stage, { x: 0, y: 0, scale: 1, transformOrigin: '0px 0px' });
    }

    const items = inspect(svgRoot);
    items.forEach((item, itemIdx) => {
      const { el, step } = item;
      const rawCfg = stepEntries[step];
      const cfg = (rawCfg && typeof rawCfg === 'object') ? rawCfg : { startSec: Number(rawCfg ?? 0) };
      const t0 = Number(cfg.startSec ?? item.startSec ?? 0);
      const anim = cfg.anim || item.anim;
      const camera = cfg.camera || item.camera || 'none';
      const subSec = Number(cfg.subDelaySec ?? (item.subDelayMs / 1000) ?? 0);

      // Initial hidden state outside timeline (HyperFrames rule: frame 0 determinism)
      gsap.set(el, { autoAlpha: 0 });
      tl.set(el, { autoAlpha: 1 }, t0);

      // Spotlight dimming of previous steps when this step activates
      if (focusMode === 'spotlight' && itemIdx > 0) {
        const prevEls = items.slice(0, itemIdx).map(x => x.el);
        tl.to(prevEls, { autoAlpha: 0.34, duration: 0.38, ease: 'power2.out' }, t0);
      }

      // Camera Rig Pan & Zoom
      if (stage) {
        const camTarget = computeCameraTarget(svgRoot, item, camera);
        tl.to(stage, {
          x: camTarget.tx,
          y: camTarget.ty,
          scale: camTarget.scale,
          duration: 0.62,
          ease: 'power3.out'
        }, t0);
      }

      if (anim === 'draw-stroke') {
        const paths = el.querySelectorAll('.anim-stroke, [pathLength="1"]');
        const endpoints = el.querySelectorAll('.anim-endpoint, .anim-arrow');
        gsap.set(paths, { strokeDasharray: 1, strokeDashoffset: 1 });
        gsap.set(endpoints, { autoAlpha: 0, scale: 0.68, y: 6, transformOrigin: '50% 50%' });
        paths.forEach((p, idx) => {
          tl.to(p, { strokeDashoffset: 0, duration: 0.46, ease: 'power3.out' }, t0 + subSec + idx * 0.065);
        });
        endpoints.forEach((ep, idx) => {
          tl.to(ep, { autoAlpha: 1, scale: 1, y: 0, duration: 0.28, ease: 'back.out(1.8)' }, t0 + subSec + 0.32 + idx * 0.075);
        });
      } else if (anim === 'slot-push' || anim === 'slot-expand') {
        const pushPx = Number(el.getAttribute('data-push') || 165);
        const left = el.querySelector('.slot-left');
        const right = el.querySelector('.slot-right');
        const core = el.querySelector('.slot-core');
        const paths = el.querySelectorAll('.anim-stroke, [pathLength="1"]');
        const endpoints = el.querySelectorAll('.anim-endpoint');
        if (left) {
          gsap.set(left, { x: pushPx });
          tl.to(left, { x: 0, duration: 0.52, ease: 'back.out(1.4)' }, t0);
        }
        if (right) {
          gsap.set(right, { x: -pushPx });
          tl.to(right, { x: 0, duration: 0.52, ease: 'back.out(1.4)' }, t0);
        }
        if (core) {
          gsap.set(core, { autoAlpha: 0, scaleX: 0.04, transformOrigin: '50% 50%' });
          tl.to(core, { autoAlpha: 1, scaleX: 1, duration: 0.46, ease: 'power3.out' }, t0 + 0.06);
        }
        gsap.set(paths, { strokeDasharray: 1, strokeDashoffset: 1 });
        paths.forEach((p, idx) => {
          tl.to(p, { strokeDashoffset: 0, duration: 0.42, ease: 'power2.out' }, t0 + subSec + 0.16 + idx * 0.05);
        });
        gsap.set(endpoints, { autoAlpha: 0, scale: 0.5, transformOrigin: '50% 50%' });
        endpoints.forEach((ep, idx) => {
          tl.to(ep, { autoAlpha: 1, scale: 1, duration: 0.26, ease: 'back.out(2)' }, t0 + subSec + 0.34 + idx * 0.055);
        });
      } else if (anim === 'polaroid-slap' || anim === 'z-stack-drop') {
        const units = el.querySelectorAll('.polaroid-unit');
        const targets = units.length > 0 ? Array.from(units) : [el];
        targets.forEach((unit, uIdx) => {
          const uTime = t0 + subSec + uIdx * 0.16;
          const card = unit.querySelector('.anim-card') || unit;
          const shadow = unit.querySelector('.anim-shadow');
          const tape = unit.querySelector('.anim-tape');
          gsap.set(card, { autoAlpha: 0, y: -36, scale: 1.14, rotation: -2.5, transformOrigin: '50% 50%' });
          tl.to(card, { autoAlpha: 1, y: 0, scale: 1, rotation: 0, duration: 0.42, ease: 'back.out(1.6)' }, uTime);
          if (shadow) {
            gsap.set(shadow, { autoAlpha: 0.04, x: 14, y: 20, scale: 1.08, transformOrigin: '50% 50%' });
            tl.to(shadow, { autoAlpha: 0.18, x: 0, y: 0, scale: 1, duration: 0.42, ease: 'power3.out' }, uTime);
          }
          if (tape) {
            gsap.set(tape, { autoAlpha: 0, scaleX: 0, transformOrigin: '0% 50%' });
            tl.to(tape, { autoAlpha: 1, scaleX: 1, duration: 0.24, ease: 'power2.out' }, uTime + 0.26);
          }
        });
      } else if (anim === 'meter-halt' || anim === 'number-ticker') {
        const fill = el.querySelector('.anim-fill');
        const wall = el.querySelector('.anim-wall');
        const badge = el.querySelector('.anim-badge');
        if (fill) {
          gsap.set(fill, { scaleX: 0, transformOrigin: '0% 50%' });
          tl.to(fill, { scaleX: 1, duration: 0.42, ease: 'power4.out' }, t0 + subSec + 0.06);
        }
        if (wall) {
          tl.to(wall, { x: 6, duration: 0.07, yoyo: true, repeat: 3, ease: 'power1.inOut' }, t0 + subSec + 0.26);
        }
        if (badge) {
          gsap.set(badge, { autoAlpha: 0, scale: 1.38, y: -6, transformOrigin: '50% 50%' });
          tl.to(badge, { autoAlpha: 1, scale: 1, y: 0, duration: 0.28, ease: 'back.out(2)' }, t0 + subSec + 0.36);
        }
      } else if (anim === 'cursor-click' || anim === 'card-expand' || anim === 'spotlight-sweep') {
        const cards = el.querySelectorAll('.anim-card, .anim-body, .anim-endpoint, .anim-stamp');
        const targets = cards.length > 0 ? Array.from(cards) : [el];
        gsap.set(targets, { autoAlpha: 0, y: 14, scale: 0.94, transformOrigin: '50% 50%' });
        targets.forEach((c, idx) => {
          tl.to(c, { autoAlpha: 1, y: 0, scale: 1, duration: 0.44, ease: 'back.out(1.7)' }, t0 + subSec + idx * 0.09);
        });
      } else {
        const cards = el.querySelectorAll('.anim-card, .anim-stamp, .anim-body');
        const targets = cards.length > 0 ? Array.from(cards) : [el];
        gsap.set(targets, { autoAlpha: 0, y: 16, scale: 0.96, transformOrigin: '50% 50%' });
        targets.forEach((c, idx) => {
          tl.to(c, { autoAlpha: 1, y: 0, scale: 1, duration: 0.36, ease: 'back.out(1.4)' }, t0 + subSec + idx * 0.11);
        });
      }
    });
  }

  return {

    inspect,

});

  <script>
    /* 逐画面审阅页（video-craft 的审阅面入口，review-surface/2.0.0）。

    const REVIEW_SURFACE_REL = "review/review-surface.json";
    const SUBMISSIONS_FALLBACK_REL = "review/review-submissions.json";
    const TIMELINE_REL = window.__REVIEW_DATA__?.timelinePath || "timeline/timeline.json";
    const CHOREO_REL = "timeline/choreography.json";

    const state = {
      chapter: null,

      sourcePageKey: null,
      caption: "",
      activeSvgStep: 1,
      focusMode: "spotlight",
      choreoOverrides: {},     // { [stepId]: { focusMode, steps: { [snum]: { anim, camera, subDelayMs, relStartSec, cue } } } }
      svgEdits: {},            // { [stepId]: [ { id, type, value, dx, dy } ] }
      annotations: {},         // { [stepId]: [ { idx, xPct, yPct, wPct, hPct } ] }

    const DRAFT_REL = "review/review-draft.json";
    let draftTimer = null;

    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(ms) {

    function label(message, kind = "") {

    function applyTheme() {

    const mediaUrls = new Map();
    async function assetUrl(rel) {
      if (/^(data:|blob:)/.test(rel)) return rel;
      rel = String(rel).replace(/^\/+/, "");
      if (!mediaUrls.has(rel)) mediaUrls.set(rel, await review.asset(rel));
      return mediaUrls.get(rel);

    async function attachMedia(el, rel) {
      if (!el || !rel) return false;

        el.src = await assetUrl(rel);
        el.addEventListener("error", () => label("媒体无法播放 · 请回对话核对编码与文件", "error"), { once: true });

    async function saveDraft() {
      if (!review) return;
      try {
        await review.draft({
          text: document.getElementById("fb-text").value,
          type: document.getElementById("fb-type").value,
          mode: fbMode, stepId: state.step,
          snapshot: window.__REVIEW_DATA__?.snapshot || loadedTimelineId,
          choreography_overrides: state.choreoOverrides,

        });
        if (!saving) label("草稿已保存 · 尚未提交", "dirty");
      } catch (error) { label(`草稿保存失败：${error.message} · 内容仍在页面`, "error"); }
    }
    async function restoreDraft() {
      let draft = null;
      // A draft is a recovery convenience, not a required project asset.
      try { draft = JSON.parse(await review.readText(DRAFT_REL, { optional: true })); } catch { return; }
      if (!draft) return;
      const hasAdjustments = [draft.choreography_overrides, draft.svg_edits, draft.annotations]
        .some(value => value && Object.keys(value).length > 0);
      if (!draft.text && !hasAdjustments && !draft.mode && !draft.theme) return;

      }
      if (draft.type) document.getElementById("fb-type").value = draft.type;
      if (timelineFingerprint === null) {

      if (draft.snapshot && draft.snapshot !== (window.__REVIEW_DATA__?.snapshot || loadedTimelineId)) {
        noteStaleFree("草稿来自上一版作品；文字已保留，画面微调未套用。", { withReload: true });
        return;
      }
      applyDraftState(draft);
    }
    function applyDraftState(draft) {
      state.choreoOverrides = draft.choreography_overrides || state.choreoOverrides;
      state.svgEdits = draft.svg_edits || {};
      state.annotations = draft.annotations || {};

    }
    function finishDraftRestore() {
      const draft = pendingDraftForTimeline;
      pendingDraftForTimeline = null;
      if (!draft) return;
      if (draft.snapshot && draft.snapshot !== (window.__REVIEW_DATA__?.snapshot || loadedTimelineId)) {
        noteStaleFree("草稿来自上一版作品；文字已保留，画面微调未套用。", { withReload: true });
        return;
      }
      applyDraftState(draft);
    }
    async function clearDraft() {
      await review.draft({ text: "", snapshot: window.__REVIEW_DATA__?.snapshot || loadedTimelineId });
    }

    function setMode(mode) {
      fbMode = mode;
      document.getElementById("mode-overall").classList.toggle("active", mode === "overall");
      document.getElementById("mode-step").classList.toggle("active", mode === "step");
      const text = document.getElementById("fb-text");
      text.placeholder = mode === "overall" ? "写下修改意见" : "针对当前屏写下意见";
      const noteEl = document.getElementById("mode-note");

    }

    async function resolveSubmissionsRel() {
      try {
        const doc = JSON.parse(await review.readText(REVIEW_SURFACE_REL));
        if (doc && doc.feedback) {
          const fb = String(doc.feedback).replace(/^\.\//, "");
          if (fb.startsWith("review/")) return fb;
          const dir = REVIEW_SURFACE_REL.replace(/[^/]+$/, "");
          return dir + fb;
        }
      } catch {}
      return SUBMISSIONS_FALLBACK_REL;
    }

    function noteStaleFree(text, { withReload = false } = {}) {
      const box = document.getElementById("stale-note");
      box.textContent = "";
      box.append(document.createTextNode(withReload ? text + " " : text));
      if (withReload) {
        const button = document.createElement("button");
        button.type = "button";
        button.id = "stale-reload";
        button.textContent = "重新加载";
        button.addEventListener("click", () => location.reload());
        box.append(button);
      }
      box.hidden = false;
    }

    function shortId(text) {
      let hash = 0x811c9dc5;
      for (let i = 0; i < text.length; i += 1) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 0x01000193);
      }
      return (hash >>> 0).toString(16).padStart(8, "0");
    }

    /* 手写或旧版 timeline.json 可能没有顶层 totalChapters / totalSteps /
       totalDurationMs（timeline_derive.py 与 import_srt_timeline.py 都会写）。
       缺了页面就显示「undefined 章 · undefined 步 · NaN:NaN」、总时长恒 00:00，
       而且不报错 —— 这里从 chapters 兜底推。 */
    function normalizeTimeline(data) {
      if (!data || typeof data !== "object") return data;
      const chapters = Array.isArray(data.chapters) ? data.chapters : [];
      const out = Object.assign({}, data, { chapters });
      if (out.totalChapters == null) out.totalChapters = chapters.length;
      if (out.totalSteps == null) {
        out.totalSteps = chapters.reduce((n, ch) => n + ((ch.steps || []).length), 0);
      }
      if (out.totalDurationMs == null) {
        let end = 0;
        for (const ch of chapters) {
          for (const st of (ch.steps || [])) {
            end = Math.max(end, Number(st.endMs) || 0);
          }
        }
        out.totalDurationMs = end;
      }
      return out;
    }

    function fingerprint(data) {
      const parts = [data.totalChapters, data.totalSteps, data.totalDurationMs];
      for (const ch of data.chapters || []) {
        parts.push(['ch', ch.id, ch.title || ''].join('\u0001'));
        for (const st of ch.steps || []) {
          parts.push(['st', st.id, st.step, st.durationMs, st.caption || '', st.screenIntent || ''].join('\u0001'));
        }
      }
      return parts.join('\u0002');
    }

    function cueRangeOf(st) {
      const r = Array.isArray(st.cueRange) ? st.cueRange
        : (Array.isArray(st.srtRange) ? st.srtRange : null);
      return (r && r.length >= 2) ? r : null;
    }

    /* ---- 右侧批注历史列表渲染 ---- */
    function renderHistoryList() {
      const box = document.getElementById("fb-history-list");
      const badge = document.getElementById("records-count-badge");
      // 「待处理」= 冲着当前这一版写的；其余归历史（折叠），不再一直挂在最上面。
      const currentBuild = window.__REVIEW_DATA__?.buildId || null;
      // 只有明确冲着当前这一版写的才算待处理。早期记录没有 buildId（那时还没这个字段），
      // 一律归历史——否则它们会永远占着「待处理」。
      const isPendingRecord = (rec) => !!currentBuild && rec.buildId === currentBuild;
      const pendingRecords = cachedRecords.filter(isPendingRecord);
      const historyRecords = cachedRecords.filter((r) => !isPendingRecord(r));
      badge.textContent = historyRecords.length
        ? `${pendingRecords.length} 条待处理 · ${historyRecords.length} 条历史`
        : `${pendingRecords.length} 条`;
      if (!cachedRecords.length) {
        box.innerHTML = `<div class="history-empty">暂无意见</div>`;
        return;
      }
      box.replaceChildren();
      let historyBox = null;
      cachedRecords.forEach((rec, idx) => {
        const card = document.createElement("div");
        const isOverall = rec.phase === "overall" || !rec.stepId;
        card.className = "fb-card" + (isOverall ? " overall-card" : "");

        const head = document.createElement("div");
        head.className = "fb-card-head";

        const badgeWrap = document.createElement("div");
        badgeWrap.className = "fb-card-badge-wrap";

        const tagBadge = document.createElement("span");
        tagBadge.className = "fb-card-badge";
        tagBadge.textContent = isOverall ? "整片" : `当前屏 · ${rec.stepId}`;
        badgeWrap.appendChild(tagBadge);

        if (rec.type) {
          const typeTag = document.createElement("span");
          typeTag.className = "fb-card-type-tag";
          const typeMap = {
            "visual": "画面与版式",
            "animation": "动画与镜头",
            "timing": "节奏与卡点",
            "copy": "文字",
            "asset": "素材",
            "motion": "动效时序",
            "audio": "声音配乐",
            "caption": "花字字幕",
            "general": "综合意见"
          };
          typeTag.textContent = `· ${typeMap[rec.type] || rec.type}`;
          badgeWrap.appendChild(typeTag);
        }
        head.appendChild(badgeWrap);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "fb-card-del";
        delBtn.textContent = "× 撤回";
        delBtn.title = "撤回此条意见";
        delBtn.addEventListener("click", async () => {
          cachedRecords.splice(idx, 1);
          renderHistoryList();
          if (review) {
            try {
              await writeSubmissionsDoc(cachedRecords);
              label(`已撤回 1 条 · 现存 ${cachedRecords.length} 条`, "ok");
            } catch {}
          }

        head.appendChild(delBtn);

        const body = document.createElement("div");
        body.className = "fb-card-body";
        body.textContent = rec.text || "";
        card.appendChild(head);
        card.appendChild(body);

          quote.className = "fb-card-quote";
          quote.textContent = `“${rec.targetQuote}”`;

          } catch {

        if (historyRecords.includes(rec)) {

            historyBox.className = "fb-history";

            sum.textContent = `历史反馈 · ${historyRecords.length} 条（针对更早的版本）`;
            historyBox.appendChild(sum);

        }

    }

    /* Official player owns the clock, media, visibility and scaling. */
    const liveStage = (() => {
      const player = document.getElementById("live-stage-frame");
      const note = document.getElementById("live-stage-note");
      let clock = null, attachedUrl = null, pendingSeek = null, pendingPlay = false;
      let watchdog = null, stopAt = null, loading = false;
      function explain(text) { note.textContent = text; note.hidden = false; }
      function report() {
        if (!player.ready) return;
        if (stopAt !== null && player.currentTime >= stopAt) {
          const end = stopAt; stopAt = null; player.seek(end); player.pause();
        }
        if (clock) clock(player.currentTime * 1000, player.paused);
      }
      player.addEventListener("ready", () => {
        clearTimeout(watchdog); note.hidden = true; loading = false;
        if (pendingSeek !== null) { player.seek(pendingSeek); pendingSeek = null; }
        if (pendingPlay) { pendingPlay = false; player.play(); }
        report();
      });
      ["timeupdate", "play", "pause", "ended"].forEach(name => player.addEventListener(name, report));
      ["playbackerror", "runtimeprotocolerror"].forEach(name => player.addEventListener(name, () => {
        explain("播放未能继续，请刷新预览后重试。你的反馈草稿会保留。");
      }));
      return {
        get ready() { return !!player.ready; },
        get durationMs() { return (player.duration || 0) * 1000; },
        get currentMs() { return (player.currentTime || 0) * 1000; },
        setClock(fn) { clock = fn; },
        async attach(url) {
          if (!url || attachedUrl === url || !review) return;
          attachedUrl = url;
          try {
            if (!customElements.get("hyperframes-player")) throw new Error("播放器未加载");
            const compStage = window.__REVIEW_DATA__?.media?.liveStage?.composition;
            if (!compStage?.html) throw new Error("画面暂未就绪，请重新构建后重试");
            const entries = Object.entries(compStage.assets || {});
            const totalMb = entries.reduce(
              (sum, [, rel]) => sum + ((compStage.assetSizes || {})[rel] || 0), 0) / 1e6;
            // The conversion below is serial and there was no progress otherwise,
            // so a big asset map looked exactly like a hung page for as long as
            // the watchdog took to fire.
            loading = true;
            explain(totalMb > 1
              ? `正在解码素材 0/${entries.length}…（共约 ${totalMb.toFixed(1)} MB，首次较久）`
              : "正在加载画面与声音…");
            let source = compStage.html;
            let done = 0;
            for (const [token, rel] of entries) {
              // Each sandboxed child has its own opaque origin; a parent's
              // blob:null URL cannot be used by the player's iframe.
              const assetUrl = await review.asset(rel);
              const blob = await (await fetch(assetUrl)).blob();
              const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("素材读取失败：" + rel));
                reader.readAsDataURL(blob);
              });
              source = source.split(token).join(dataUrl);
              done += 1;
              if (done < entries.length) {
                explain(`正在解码素材 ${done}/${entries.length}…`
                        + `（共约 ${totalMb.toFixed(1)} MB，首次较久）`);
              }
            }
            explain("素材已解码，正在启动播放器…");
            player.setAttribute("srcdoc", source);
          } catch (error) {
            attachedUrl = null;
            loading = false;
            explain("预览加载失败：" + error.message + "。反馈草稿仍然保留。");
          }
        },
        seek(sec) {
          stopAt = null; pendingPlay = false;
          if (player.ready) { player.seek(sec); report(); } else pendingSeek = sec;
        },
        play() { if (player.ready) player.play(); else pendingPlay = true; },
        pause() { pendingPlay = false; if (player.ready) player.pause(); },
        rate(value) { player.playbackRate = value; },
        mute(flag) {
          try {
            if ("muted" in player) player.muted = !!flag;
            if ("volume" in player) player.volume = flag ? 0 : 1;
          } catch {}
        },
        range(start, end) { this.seek(start); stopAt = end; this.play(); },
        hello() {},
        explain,
        watchdog(budgetMs) {
          clearTimeout(watchdog);
          if (player.ready) return;
          // The budget scales with what there is to decode. A fixed 8s was only
          // ever right for a small asset map: a 25 MB srcdoc blew it, and the one
          // sentence it printed ("确认预览服务正在运行") named the single thing
          // that was in fact fine.
          const declared = window.__REVIEW_DATA__?.media?.liveStage?.budgetMs;
          const budget = Number.isFinite(budgetMs) && budgetMs > 0
            ? budgetMs : (Number(declared) > 0 ? Number(declared) : 8000);
          watchdog = setTimeout(() => {
            if (player.ready) return;
            if (!review) {
              explain("离线，刷新重试。");
            } else if (loading) {
              explain("素材解码中，请稍候。");

    /* ---- 舞台视图切换（静态画面 / 实时预览 / 合成成片） ---- */
    let stageViewMode = "svg"; // 'svg' | 'live' | 'composite'
    function setStageViewMode(mode) {
      window.__vcSetStageMode = setStageViewMode;
      // 舞台按「这个项目有什么数据」选：实时预览优先，其次合成成片，最后静态页。
      // 原模板在这里写死 `mode = "composite"`，把调用方传进来的选择丢掉了 ——
      // 连初始化那句 setStageViewMode("svg") 也变成切到合成台，而合成台在没有成片时
      // 只是一张空占位。参数就是参数，不许改写。

      stageViewMode = mode;
      window.__vcStageMode = mode;
      document.body.dataset.stage = mode;

      const liveWrap = document.getElementById("live-stage-wrap");
      const compWrap = document.getElementById("composite-player-wrap");
      const compVid = document.getElementById("composite-video-player");
      const compEmpty = document.getElementById("composite-empty-placeholder");
      const spkVid = document.getElementById("stage-speaker-video");

      if (svgWrap) svgWrap.hidden = (mode !== "svg");
      if (liveWrap) liveWrap.hidden = (mode !== "live");
      if (compWrap) compWrap.hidden = (mode !== "composite");

        if (spkVid && !spkVid.paused) {

        }
        pauseGlobalPlayback();
        const compSrc = compVid && compVid.getAttribute("src");
        if (compSrc) {

        const t = (curTimeSec === undefined || curTimeSec === null) ? 0 : curTimeSec;

    async function seekGlobalTime(targetSec) {

    const demoProxyUrls = new Map();
    async function syncDemoProxyAt(curSec, playing) {
      const demoVid = document.getElementById("demo-proxy-video");
      const compVid = document.getElementById("composite-video-player");
      if (!demoVid) return;
      const list = window.__REVIEW_DATA__?.media?.demoProxies || [];
      const allowOverlay = stageViewMode !== "composite"
        || !compVid?.getAttribute("src")

      const t = Number(curSec) || 0;
      const entry = allowOverlay ? list.find(d => t >= ((d.startMs || 0) / 1000) && t < ((d.endMs || 0) / 1000)) : null;
      if (!entry) {
        if (!demoVid.paused) { try { demoVid.pause(); } catch {} }
        demoVid.hidden = true;
        return;
      }
      const rel = entry.url || entry.proxy;
      if (!rel) { demoVid.hidden = true; return; }
      if (!demoProxyUrls.has(rel)) {
        try { demoProxyUrls.set(rel, review ? await assetUrl(rel) : rel); } catch { demoProxyUrls.set(rel, rel); }
      }
      const url = demoProxyUrls.get(rel);

      const ch = Number(geo.height) || 1080;

      demoVid.style.top = ((Number(box.y) || 0) / ch * 100) + "%";
      demoVid.style.width = ((Number(box.w) || cw) / cw * 100) + "%";
      demoVid.style.height = ((Number(box.h) || ch) / ch * 100) + "%";

    (function initMainSplitHandle() {

        dragging = false;
        document.body.classList.remove("col-resizing");

    async function setAudioMode(mode) {
      audioMode = mode === "dry" ? "dry" : "mix";
      document.body.dataset.audioMode = audioMode;
      const btn = document.getElementById("btn-audio-ab");
      if (btn) {

    const audioAbBtn = document.getElementById("btn-audio-ab");

    const prevScreenBtn = document.getElementById("btn-prev-screen");

        // 在还没点过左侧列表时完全没反应——看起来就像坏了。
        if (!allScreensList.length) return;
        const curIdx = state.currentScreenObj
          ? allScreensList.findIndex(s => s.id === state.currentScreenObj.id) : -1;
